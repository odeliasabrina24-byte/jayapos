<script>
/* ================= TablesJs: floor plan, open bills, layout editor ================= */

const Floor = { data: null, area: null, editing: false, draft: [], drag: null, offset: 0, timer: null, loading: false };
const SIZE_OPTIONS = [{ value: 14, label: 'Kecil' }, { value: 18, label: 'Sedang' }, { value: 24, label: 'Besar' }, { value: 30, label: 'Sangat besar' }];
const SHAPE_LABELS = { SQUARE: 'Kotak', ROUND: 'Bulat', RECT: 'Panjang (persegi panjang)' };

App.resetHooks.push(function () { Floor.data = null; Floor.editing = false; Floor.area = null; });

Views.tables = function () {
  floorLoad(false);
  if (!Floor.timer) {
    Floor.timer = setInterval(function () {   // keep the floor fresh when several phones are serving
      if (App.view === 'tables' && !Floor.editing && !document.hidden && App.token) floorLoad(true);
    }, 20000);
  }
};

async function floorLoad(silent) {
  if (Floor.loading) return;
  Floor.loading = true;
  if (!silent && !Floor.data) $('floor').innerHTML = '<div class="floor-empty">Memuat meja…</div>';
  try {
    const d = await api('apiGetFloor', App.token);
    Floor.data = d;
    Floor.offset = Date.now() - d.serverNow;
    if (!Floor.area || d.areas.indexOf(Floor.area) < 0) {
      Floor.area = d.areas.filter(function (a) { return d.tables.some(function (t) { return t.area === a; }); })[0] || d.areas[0] || 'Indoor';
    }
    $('floorEdit').hidden = !d.canEditLayout || Floor.editing;
    $('floorTakeaway').hidden = !d.canServe || !can('pos.sell');
    if (!Floor.editing) floorRender();
  } catch (e) {
    if (!silent) $('floor').innerHTML = '<div class="floor-empty">' + esc(e.message) + '</div>';
  } finally {
    Floor.loading = false;
  }
}

function floorTables() {
  const list = Floor.editing ? Floor.draft : (Floor.data ? Floor.data.tables : []);
  return list.filter(function (t) { return t.area === Floor.area; });
}

function floorAreas() {
  const areas = (Floor.data ? Floor.data.areas : []).slice();
  if (Floor.editing) Floor.draft.forEach(function (t) { if (areas.indexOf(t.area) < 0) areas.push(t.area); });
  return Floor.editing ? areas : areas.filter(function (a) {
    return Floor.data.tables.some(function (t) { return t.area === a; });
  });
}

function minutesOpen(o) {
  if (!o.openedMs) return '';
  const m = Math.max(0, Math.floor((Date.now() - Floor.offset - o.openedMs) / 60000));
  return m < 60 ? m + 'm' : Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0');
}

function floorRender() {
  const d = Floor.data;
  if (!d) return;
  const areas = floorAreas();
  $('areaBar').innerHTML = areas.map(function (a) {
    const busy = d.tables.filter(function (t) { return t.area === a && d.open[t.id]; }).length;
    return '<button class="chip' + (a === Floor.area ? ' active' : '') + '" type="button" data-area="' + esc(a) + '">' + esc(a) +
      (busy && !Floor.editing ? ' · ' + busy : '') + '</button>';
  }).join('');
  $('editBar').hidden = !Floor.editing;
  $('floorTools').hidden = Floor.editing;
  $('floor').classList.toggle('editing', Floor.editing);

  const tables = floorTables();
  $('floor').innerHTML = tables.length ? tables.map(function (t) {
    const o = !Floor.editing && d.open[t.id];
    const r = !Floor.editing && !o && floorRsvp(t);
    const cls = 'tbl' + (t.shape === 'ROUND' ? ' round' : '') + (o ? ' busy' : '') + (r ? ' rsvp' : '');
    const sub = o ? o.pax + ' pax · ' + minutesOpen(o) : r ? r.pax + ' pax · RSVP ' + r.time : t.seats + ' kursi';
    return '<button class="' + cls + '" type="button" data-tid="' + esc(t.id || t.tmp) + '" style="left:' + t.x + '%;top:' + t.y +
      '%;width:' + t.w + '%;height:' + t.h + '%"><span class="tbl-name">' + esc(t.name) + '</span>' +
      (o && o.guest ? '<span class="tbl-guest">' + esc(o.guest) + '</span>' : r ? '<span class="tbl-guest">' + esc(r.guest) + '</span>' : '') +
      '<span class="tbl-sub">' + sub + '</span>' +
      (o ? '<span class="tbl-amt">' + (o.items ? 'Rp ' + fmtShort(o.subtotal) : 'belum ada item') + '</span>' : '') +
      (o && o.ready ? '<span class="tbl-ready">SIAP ' + o.ready + '</span>' : '') + '</button>';
  }).join('') : '<div class="floor-empty">' + (Floor.editing ? 'Belum ada meja di area ini. Ketuk “+ Tambah meja”.' : 'Tidak ada meja di area ini.') + '</div>';

  if (!Floor.editing) {
    const open = Object.keys(d.open).map(function (k) { return d.open[k]; });
    const guests = open.reduce(function (s, o) { return s + o.pax; }, 0);
    const amount = open.reduce(function (s, o) { return s + o.subtotal; }, 0);
    $('floorSummary').textContent = open.length + ' dari ' + d.tables.length + ' meja terisi · ' + guests + ' tamu · ' + rp(amount) +
      ' di bill terbuka (sebelum service & pajak). Ketuk meja kosong untuk menerima tamu.';
  } else {
    $('floorSummary').textContent = 'Mengubah denah ' + Floor.area + '. Perubahan baru tersimpan setelah “Simpan denah”.';
  }
}

/* ---------- Serving ---------- */
function floorRsvp(t) {
  const d = Floor.data;
  return (d && d.reserved && d.reserved[String(t.name || '').trim().toLowerCase()]) || null;
}

async function floorTap(tid) {
  const d = Floor.data;
  const t = d.tables.filter(function (x) { return x.id === tid; })[0];
  if (!t) return;
  if (!d.canServe) return toast('Role Anda bisa mengubah denah, tapi tidak bisa menerima pesanan.', 'warn');
  const o = d.open[t.id];
  if (o) {
    showLoading(true, 'Membuka ' + t.name + '…');
    try { posEnterTable(await api('apiGetOpenOrder', App.token, o.orderId)); }
    catch (e) { toast(e.message, 'err'); floorLoad(true); }
    finally { showLoading(false); }
    return;
  }
  const r = floorRsvp(t);
  openForm({
    title: 'Terima tamu di ' + t.name,
    submitLabel: 'Buka meja',
    fields: [{ name: 'pax', label: 'Total pax', type: 'number', min: 1, max: 99, value: r ? r.pax : Math.min(t.seats || 2, 2),
               help: t.seats + ' kursi di meja ini' },
             { name: 'guest', label: 'Nama tamu (opsional)', value: r ? r.guest : '', help: 'Contoh: Pak Budi. Muncul di denah, di layar dapur dan di struk.' }],
    onSubmit: async function (v) {
      if (!Number.isInteger(v.pax) || v.pax < 1 || v.pax > 99) throw new Error('Pax harus 1 sampai 99.');
      const order = await api('apiOpenTable', App.token, t.id, v.pax, v.guest.slice(0, 40));
      if (order.alreadyOpen) toast(t.name + ' baru saja dibuka oleh ' + order.openedBy + '. Ini bill-nya.', 'warn');
      posEnterTable(order);
    }
  });
}

/* ---------- Layout editor (admin) ---------- */
function editStart() {
  Floor.editing = true;
  Floor.draft = Floor.data.tables.map(function (t) { return Object.assign({}, t); });
  $('floorEdit').hidden = true;
  floorRender();
}

function editStop() {
  Floor.editing = false;
  Floor.draft = [];
  $('floorEdit').hidden = !(Floor.data && Floor.data.canEditLayout);
  floorRender();
}

function draftFind(tid) {
  return Floor.draft.filter(function (t) { return (t.id || t.tmp) === tid; })[0];
}

function editAdd() {
  const names = Floor.draft.map(function (t) { return t.name; });
  let n = Floor.draft.length + 1;
  while (names.indexOf('T' + n) >= 0) n++;
  const t = { id: '', tmp: 'new' + Date.now(), name: 'T' + n, area: Floor.area, seats: 4, shape: 'SQUARE', x: 41, y: 41, w: 18, h: 18 };
  Floor.draft.push(t);
  floorRender();
  editTable(t);
}

function editTable(t) {
  const size = t.shape === 'RECT' ? t.h : t.w;
  const sizeVal = SIZE_OPTIONS.reduce(function (best, o) { return Math.abs(o.value - size) < Math.abs(best - size) ? o.value : best; }, 18);
  openForm({
    title: 'Meja ' + t.name,
    submitLabel: 'Terapkan',
    fields: [
      { name: 'name', label: 'Nama meja', value: t.name, help: 'Singkat, contoh T5, Bar 1, VIP' },
      { name: 'area', label: 'Area', value: t.area, datalist: floorAreas(), help: 'Pilih area atau ketik area baru' },
      { name: 'seats', label: 'Jumlah kursi', type: 'number', min: 1, max: 50, value: t.seats },
      { name: 'shape', label: 'Bentuk', type: 'select', value: t.shape,
        options: Object.keys(SHAPE_LABELS).map(function (k) { return { value: k, label: SHAPE_LABELS[k] }; }) },
      { name: 'size', label: 'Ukuran di denah', type: 'select', value: sizeVal, options: SIZE_OPTIONS },
      { name: 'remove', label: 'Hapus meja ini', type: 'checkbox', value: false }
    ],
    onSubmit: async function (v) {
      if (v.remove) {
        Floor.draft = Floor.draft.filter(function (x) { return x !== t; });
        floorRender();
        return;
      }
      if (!v.name) throw new Error('Nama meja wajib diisi.');
      if (!Number.isInteger(v.seats) || v.seats < 1 || v.seats > 50) throw new Error('Jumlah kursi harus 1 sampai 50.');
      const s = Number(v.size);
      t.name = v.name.slice(0, 20);
      t.area = (v.area || 'Indoor').slice(0, 30);
      t.seats = v.seats;
      t.shape = v.shape;
      t.w = v.shape === 'RECT' ? Math.min(60, s * 2) : s;
      t.h = s;
      t.x = Math.min(t.x, 100 - t.w);
      t.y = Math.min(t.y, 100 - t.h);
      if (t.area !== Floor.area) Floor.area = t.area;
      floorRender();
    }
  });
}

async function editSave() {
  showLoading(true, 'Menyimpan denah…');
  try {
    const d = await api('apiSaveLayout', App.token, Floor.draft.map(function (t) {
      return { id: t.id, name: t.name, area: t.area, seats: t.seats, shape: t.shape, x: t.x, y: t.y, w: t.w, h: t.h };
    }));
    Floor.data = d;
    Floor.offset = Date.now() - d.serverNow;
    toast('Denah tersimpan');
    editStop();
  } catch (e) {
    toast(e.message, 'err');
  } finally {
    showLoading(false);
  }
}

/* Drag to move (mouse or finger) */
function dragStart(e) {
  const el = e.target.closest('.tbl');
  if (!el || !Floor.editing) return;
  const t = draftFind(el.dataset.tid);
  if (!t) return;
  e.preventDefault();
  const rect = $('floor').getBoundingClientRect();
  Floor.drag = { el: el, t: t, sx: e.clientX, sy: e.clientY, x0: t.x, y0: t.y, rect: rect, moved: false };
  el.classList.add('dragging');
  try { el.setPointerCapture(e.pointerId); } catch (x) {}
}

function dragMove(e) {
  const g = Floor.drag;
  if (!g) return;
  const dx = (e.clientX - g.sx) / g.rect.width * 100;
  const dy = (e.clientY - g.sy) / g.rect.height * 100;
  if (Math.abs(e.clientX - g.sx) + Math.abs(e.clientY - g.sy) > 6) g.moved = true;
  if (!g.moved) return;
  g.t.x = Math.round(Math.max(0, Math.min(100 - g.t.w, g.x0 + dx)));
  g.t.y = Math.round(Math.max(0, Math.min(100 - g.t.h, g.y0 + dy)));
  g.el.style.left = g.t.x + '%';
  g.el.style.top = g.t.y + '%';
}

function dragEnd() {
  const g = Floor.drag;
  if (!g) return;
  Floor.drag = null;
  g.el.classList.remove('dragging');
  if (!g.moved) editTable(g.t);
}

/* ---------- Events ---------- */
(function tablesBind() {
  $('areaBar').addEventListener('click', function (e) {
    const b = e.target.closest('[data-area]');
    if (!b) return;
    Floor.area = b.dataset.area;
    floorRender();
  });
  $('floor').addEventListener('click', function (e) {
    if (Floor.editing) return;
    const b = e.target.closest('.tbl');
    if (b) floorTap(b.dataset.tid);
  });
  $('floor').addEventListener('pointerdown', dragStart);
  $('floor').addEventListener('pointermove', dragMove);
  $('floor').addEventListener('pointerup', dragEnd);
  $('floor').addEventListener('pointercancel', dragEnd);
  $('floorRefresh').addEventListener('click', function () { floorLoad(false); });
  $('floorTakeaway').addEventListener('click', function () {
    if (Pos.ctx) {
      if (posIsDirty() && !confirm('Perubahan di ' + Pos.ctx.tableName + ' belum disimpan. Tetap keluar tanpa menyimpan?')) return;
      posLeaveTable();
    }
    go('pos');
  });
  $('floorEdit').addEventListener('click', editStart);
  $('editAdd').addEventListener('click', editAdd);
  $('editCancel').addEventListener('click', editStop);
  $('editSave').addEventListener('click', editSave);
})();
</script>
