<script>
/* ================= RsvpJs: daftar RSVP (tamu yang sudah pesan meja) ================= */

const Rsvp = { date: '', rows: [] };

function rsvpShift(days) {
  const d = new Date((Rsvp.date || posTodayStr()) + 'T12:00:00');
  d.setDate(d.getDate() + days);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

Views.rsvp = function () {
  if (!Rsvp.date) Rsvp.date = posTodayStr();
  rsvpLoad();
};

async function rsvpLoad() {
  Mod.render('<div class="empty">Memuat…</div>');
  try {
    const d = await api('apiGetRsvp', App.token, Rsvp.date);
    Rsvp.date = d.date;
    Rsvp.rows = d.rows;
    rsvpRender();
  } catch (e) {
    Mod.render('<div class="empty">' + esc(e.message) + '</div>');
  }
}

function rsvpRender() {
  const label = Rsvp.date === posTodayStr() ? 'Hari ini · ' + Rsvp.date : Rsvp.date;
  const pax = Rsvp.rows.reduce(function (s, r) { return s + r.pax; }, 0);
  let html = '<div class="toolbar"><button class="btn small" type="button" data-act="prev">◀ Kemarin</button>' +
    '<button class="btn small" type="button" data-act="today">Hari ini</button>' +
    '<button class="btn small" type="button" data-act="next">Besok ▶</button>' +
    '<button class="btn small" type="button" data-act="add">+ RSVP baru</button></div>' +
    '<p class="muted small">' + esc(label) + ' · ' + Rsvp.rows.length + ' tamu · ' + pax + ' pax</p>';
  html += Rsvp.rows.length ? Rsvp.rows.map(function (r) {
    const items = r.items ? '<div class="small muted">Pesanan awal (lama): ' + esc(r.items) + '</div>' : '';
    const pre = r.preorder && r.preorder.length ? '<div class="small"><b>Pre-order ke dapur saat tamu datang:</b> ' +
      r.preorder.map(function (p) { return p.qty + '× ' + esc(p.name); }).join(', ') + '</div>' : '';
    return '<div class="tx">' +
      '<div class="tx-top"><b>' + esc(r.time) + ' · ' + esc(r.guest) + '</b><span class="tag">' + r.pax + ' pax</span></div>' +
      '<div class="tx-meta">' + (r.table ? '<span class="tag table-tag">' + esc(r.table) + '</span>' : '<span class="tag">Meja belum ditentukan</span>') +
      (r.strict ? '<span class="tag">Khusus RSVP</span>' : '') + '</div>' +
      items + pre +
      (r.notes ? '<div class="small muted">Catatan: ' + esc(r.notes) + '</div>' : '') +
      '<div class="toolbar"><button class="link-btn small" type="button" data-act="edit" data-id="' + esc(r.id) + '">Ubah</button>' +
      '<button class="link-btn small" type="button" data-act="cancel" data-id="' + esc(r.id) + '">Batalkan</button></div>' +
      '</div>';
  }).join('') : '<div class="empty">Belum ada RSVP untuk tanggal ini.</div>';
  Mod.render(html);
  Mod.on({
    prev: function () { Rsvp.date = rsvpShift(-1); rsvpLoad(); },
    next: function () { Rsvp.date = rsvpShift(1); rsvpLoad(); },
    today: function () { Rsvp.date = posTodayStr(); rsvpLoad(); },
    add: function () { rsvpForm(null); },
    edit: function (el) { rsvpForm(Rsvp.rows.filter(function (r) { return r.id === el.dataset.id; })[0]); },
    cancel: function (el) { rsvpCancel(el.dataset.id); }
  });
}

/** Jam RSVP setiap 30 menit, 10:00 sampai 23:30. Jam lama di luar daftar tetap ditampilkan. */
function rsvpTimeOptions_(current) {
  const out = [];
  for (let m = 10 * 60; m <= 23 * 60 + 30; m += 30) {
    const t = String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
    out.push({ value: t, label: t });
  }
  if (current && !out.some(function (o) { return o.value === current; })) out.push({ value: current, label: current + ' (di luar jadwal)' });
  return out;
}

async function rsvpForm(r) {
  let opts = { menu: [], tables: [] };
  try { opts = await api('apiGetRsvpMenu', App.token); } catch (e) { opts = { menu: [], tables: [] }; }
  const menu = opts.menu || [];
  const tableOpts = [{ value: '', label: 'Belum ditentukan' }].concat((opts.tables || []).map(function (n) { return { value: n, label: n }; }));
  if (r && r.table && (opts.tables || []).indexOf(r.table) < 0) tableOpts.push({ value: r.table, label: r.table + ' (tidak ada di denah)' });
  const preChosen = r ? r.preorder.map(function (p) { return p.id; }) : [];
  const fields = [
      { name: 'date', label: 'Tanggal', value: r ? r.date : Rsvp.date, help: 'Format 2026-10-11' },
      { name: 'time', label: 'Jam', type: 'select', options: rsvpTimeOptions_(r ? r.time : ''), value: r ? r.time : '19:00',
        help: 'Pilih jam datang tamu (setiap 30 menit).' },
      { name: 'guest', label: 'Nama tamu', value: r ? r.guest : '' },
      { name: 'pax', label: 'Jumlah orang (pax)', type: 'number', value: r ? r.pax : 2 },
      { name: 'table', label: 'Meja', type: 'select', options: tableOpts, value: r ? r.table : '',
        help: 'Pilih dari denah. Pilih "Belum ditentukan" kalau belum tahu.' },
      { name: 'notes', label: 'Catatan (opsional)', value: r ? r.notes : '' },
      { name: 'strict', label: 'Meja khusus RSVP', type: 'checkbox', value: r ? r.strict : false,
        help: 'Meja ini ditandai RSVP sejak pagi di denah, dan staff diingatkan 15 menit sebelum jam RSVP. Isi meja dulu.' }
    ];
  if (menu.length) {
    fields.push({ name: 'preorder', label: 'Pre-order (opsional)', type: 'multi', value: preChosen,
      options: menu.map(function (p) { return { value: p.id, label: p.name }; }),
      help: 'Dimuat ke bill saat tamu datang. Jumlah bisa diubah di kasir sebelum disimpan ke dapur.' });
  }
  openForm({
    title: r ? 'Ubah RSVP' : 'RSVP baru',
    fields: fields,
    submitLabel: 'Simpan',
    onSubmit: async function (v) {
      const qtyOf = {};
      if (r) r.preorder.forEach(function (p) { qtyOf[p.id] = p.qty; });
      const data = Object.assign({ id: r ? r.id : '' }, v);
      data.preorder = (v.preorder || []).map(function (id) { return { id: id, qty: qtyOf[id] || 1 }; });
      await api('apiSaveRsvp', App.token, data);
      toast('RSVP disimpan.');
      Rsvp.date = v.date;
      rsvpLoad();
    }
  });
}

async function rsvpCancel(id) {
  if (!confirm('Batalkan RSVP ini?')) return;
  try {
    await api('apiCancelRsvp', App.token, id);
    toast('RSVP dibatalkan.');
    rsvpLoad();
  } catch (e) {
    toast(e.message, 'warn');
  }
}
</script>
