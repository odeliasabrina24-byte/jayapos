<script>
/* ---------------- Printer Epson TM-T82X lewat ePOS SDK (JavaScript) ----------------
 * IP printer di jaringan lokal. Halaman https memakai port 8043 (WebSocket aman),
 * dan printer memakai sertifikat buatan sendiri (sudah diterima di tablet). */
const EPSON_PRINTER_IP = '192.168.100.7';

/** Kirim satu struk ke printer. buildFn(dev) mengisi isi struk. */
function eposPrint(buildFn) {
  return new Promise(function (resolve, reject) {
    if (typeof epson === 'undefined' || !epson.ePOSDevice) {
      reject(new Error('SDK printer belum termuat. Refresh halaman lalu coba lagi.'));
      return;
    }
    const secure = window.location.protocol === 'https:';
    const port = secure ? 8043 : 8008;
    const ep = new epson.ePOSDevice();
    ep.connect(EPSON_PRINTER_IP, port, function (code) {
      if (code !== 'OK' && code !== 'SSL_CONNECT_OK') {
        reject(new Error('Tidak bisa terhubung ke printer (' + code + '). Cek kabel LAN dan IP ' + EPSON_PRINTER_IP + '.'));
        return;
      }
      ep.createDevice('local_printer', ep.DEVICE_TYPE_PRINTER, { crypto: secure, buffer: false }, function (dev, dcode) {
        if (!dev) {
          reject(new Error('Printer tidak siap (' + dcode + ').'));
          return;
        }
        dev.timeout = 15000;
        dev.onreceive = function (res) {
          ep.deleteDevice(dev, function () {});
          ep.disconnect();
          if (res && res.success) resolve(true);
          else reject(new Error('Printer menolak cetakan (' + (res && res.code) + '). Cek kertas dan tutup printer.'));
        };
        try {
          buildFn(dev);
          dev.send();
        } catch (e) {
          reject(e);
        }
      });
    });
  });
}

/* ---------------- JayaPrint (aplikasi Android sendiri, pengganti RawBT) ----------------
 * JayaPOS menyusun perintah printer (ESC/POS) lalu menyerahkannya ke aplikasi JayaPrint
 * lewat link intent://. JayaPrint mengirimnya ke printer (port 9100) dan langsung kembali
 * ke JayaPOS. IP printer diatur di aplikasi JayaPrint, bukan di sini. */
const JAYAPRINT_PKG = 'com.babikopijaya.jayaprint';
const JAYAPRINT_APK = 'https://github.com/odeliasabrina24-byte/jayapos/releases/latest';

/** Teks struk (baris dipisah \n) jadi perintah ESC/POS: nama usaha & TOTAL tebal-besar, lalu potong. */
function escposFromReceiptText(text) {
  const bytes = [0x1B, 0x40];                              // ESC @ reset printer
  const push = function (s) {
    s = String(s).normalize('NFD').replace(/[̀-ͯ]/g, '');
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      bytes.push(c === 10 || (c >= 32 && c < 127) ? c : 63); // selain ASCII jadi '?'
    }
  };
  const big = function (on) {
    bytes.push(0x1B, 0x45, on ? 1 : 0);                    // ESC E: tebal
    bytes.push(0x1D, 0x21, on ? 0x01 : 0x00);              // GS !: tinggi 2x (lebar tetap, jadi baris tetap rapi)
  };
  text.split('\n').forEach(function (line, i) {
    const emphasize = i === 1 || /^TOTAL\s/.test(line) || /^\s*\*\*\*/.test(line);
    if (emphasize) big(true);
    push(line + '\n');
    if (emphasize) big(false);
  });
  bytes.push(0x1D, 0x56, 0x42, 0x03);                      // GS V B: maju lalu potong kertas
  return bytes;
}

function bytesToBase64_(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 4096) s += String.fromCharCode.apply(null, bytes.slice(i, i + 4096));
  return btoa(s);
}

/** Serahkan perintah printer ke aplikasi JayaPrint. Harus dipanggil langsung dari klik tombol. */
function sendToJayaPrint(bytes) {
  const url = 'intent://print#Intent;scheme=jayaprint;package=' + JAYAPRINT_PKG +
              ';S.data=' + encodeURIComponent(bytesToBase64_(bytes)) +
              ';S.browser_fallback_url=' + encodeURIComponent(JAYAPRINT_APK) + ';end';
  const a = document.createElement('a');
  a.href = url;
  a.target = '_top';            // JayaPOS jalan di dalam bingkai Google; link harus dibuka di halaman utama
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

/** Cetak struk yang sedang dibuka di layar lewat JayaPrint (selalu 48 kolom = kertas 80mm). */
function printJayaPrintReceipt() {
  if (!currentReceipt) return;
  const r = Object.assign({}, currentReceipt, {
    header: Object.assign({}, currentReceipt.header || {}, { widthMm: 80 })
  });
  try {
    sendToJayaPrint(escposFromReceiptText(receiptText(r)));
  } catch (e) {
    toast('Gagal membuka JayaPrint: ' + e.message, 'error');
  }
}

/** Cetak struk yang sedang dibuka di layar. */
async function printEposReceipt() {
  if (!currentReceipt) return;
  const text = receiptText(currentReceipt);
  try {
    toast('Mencetak...');
    await eposPrint(function (dev) {
      dev.addText(text + '\n');
      dev.addFeedLine(3);
      dev.addCut(dev.CUT_FEED);
    });
    toast('Struk tercetak');
  } catch (e) {
    toast(e.message, 'error');
  }
}
</script>
