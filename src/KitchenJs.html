<script>
/* ================= KitchenJs: Layar Dapur / Layar Bar (order tickets) ================= */

const Kit = { station: null, data: null, tab: 'open', timer: null, lastIds: null, offset: 0, loading: false, pend: {}, busy: {}, hide: {} };
const KIT_NAMES = { FOOD: 'Dapur', BAR: 'Bar' };

App.resetHooks.push(function () { Kit.station = null; Kit.data = null; Kit.lastIds = null; kitBadgeStop(); });

/* ----- top-bar counter: how many tickets wait for this user's screen (Dapur / Bar) ----- */
const KitBadge = { timer: null, c: null };

function kitBadgeStart() {
  if (!(can('kitchen.food') || can('kitchen.bar') || can('tables.serve'))) return;
  kitBadgeLoad();
  if (!KitBadge.timer) KitBadge.timer = setInterval(function () { if (App.token && !document.hidden) kitBadgeLoad(); }, 20000);
}

function kitBadgeStop() {
  if (KitBadge.timer) { clearInterval(KitBadge.timer); KitBadge.timer = null; }
  KitBadge.c = null;
  kitBadgeRender();
}

async function kitBadgeLoad() {
  try { KitBadge.c = await api('apiKitchenCount', App.token); kitBadgeRender(); } catch (e) {}
}

/** Used by the open screen too, so the counter matches what is on the screen. */
function kitBadgeSet(open, late) {
  if (Kit.station === 'FOOD' && KitBadge.c) KitBadge.c.FOOD = open;
  if (Kit.station === 'BAR' && KitBadge.c) KitBadge.c.BAR = open;
  if (KitBadge.c) KitBadge.c.late = late;
  kitBadgeRender();
}

function kitBadgeRender() {
  const pill = $('kitPill');
  if (!pill) return;
  const c = KitBadge.c;
  const parts = [];                       // each part opens its own screen (see HomeJs)
  if (c && c.FOOD !== null) parts.push('<span data-go="kitchen">Dapur ' + c.FOOD + '</span>');
  if (c && c.BAR !== null) parts.push('<span data-go="bar_orders">Bar ' + c.BAR + '</span>');
  if (c && c.READY !== null && c.READY !== undefined) parts.push('<span data-go="serve">Siap diantar ' + c.READY + '</span>');
  pill.hidden = !parts.length;
  pill.innerHTML = parts.join(' · ') + (c && c.late ? ' <b class="kit-late">⚠ ' + c.late + '</b>' : '');
  pill.classList.toggle('late', !!(c && c.late));
}

Views.kitchen = function () { kitShow('FOOD'); };
Views.bar_orders = function () { kitShow('BAR'); };

/* Layar Barista: geser ke kiri langsung ke Siap Diantar. Tombol dan tab tidak ikut. */
let barSwipe = null;
document.addEventListener('touchstart', function (e) {
  barSwipe = null;
  if (App.view !== 'bar_orders' || e.touches.length !== 1) return;
  if (e.target.closest('#kitTabs, button, input, .pbox')) return;
  barSwipe = { x: e.touches[0].clientX, y: e.touches[0].clientY, at: Date.now() };
}, { passive: true });
document.addEventListener('touchend', function (e) {
  const s = barSwipe;
  barSwipe = null;
  if (!s || App.view !== 'bar_orders' || !App.nav.some(function (n) { return n.id === 'serve'; })) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - s.x, dy = t.clientY - s.y;
  if (dx < -60 && Math.abs(dy) < 70 && Date.now() - s.at < 900) go('serve');
}, { passive: true });

function kitShow(station) {
  if (Kit.station !== station) { Kit.lastIds = null; Kit.tab = 'open'; Kit.data = null; Kit.pend = {}; }
  Kit.station = station;
  Mod.render('<div class="kit-top"><button class="btn small" type="button" data-act="home">‹ Beranda</button>' +
    '<div class="filter-bar" id="kitTabs"></div>' +
    '<div class="tools-right"><span class="small muted" id="kitStamp"></span><button class="btn small" type="button" data-act="reload">↻</button></div></div>' +
    '<div class="kds" id="kitBody"><div class="empty">Memuat…</div></div>');
  Mod.on({
    home: function () { go('home'); },
    reload: function () { kitLoad(false); },
    tab: function (el) { Kit.tab = el.dataset.t; kitRender(); },
    done: function (el) { kitDone(el.dataset.id, false); },
    undo: function (el) { kitDone(el.dataset.id, true); },
    pbox: function (el) { kitToggleBox(el.dataset.id, Number(el.dataset.idx), Number(el.dataset.n)); },
    send: function (el) { kitSendPending(el.dataset.id); },
    cancelpend: function (el) { kitClearPend(el.dataset.id); kitRender(); },
    start: function (el) { kitStart(el.dataset.id); }
  });
  kitLoad(false);
  if (!Kit.timer) {
    Kit.timer = setInterval(function () {
      if ((App.view === 'kitchen' || App.view === 'bar_orders') && !document.hidden && App.token) kitLoad(true);
      else if (App.view !== 'kitchen' && App.view !== 'bar_orders') { clearInterval(Kit.timer); Kit.timer = null; }
    }, 15000);
  }
}

async function kitLoad(silent) {
  if (Kit.loading) return;
  Kit.loading = true;
  const station = Kit.station;
  try {
    const d = await api('apiGetKitchen', App.token, station);
    if (station !== Kit.station || !$('kitBody')) return;
    const openIds = d.open.map(function (t) { return t.id; });
    Object.keys(Kit.hide).forEach(function (id) { if (openIds.indexOf(id) < 0) delete Kit.hide[id]; });
    d.open = d.open.filter(function (t) { return !Kit.hide[t.id]; });
    Kit.offset = Date.now() - d.serverNow;
    const ids = d.open.map(function (t) { return t.id; });
    if (Kit.lastIds && ids.some(function (id) { return Kit.lastIds.indexOf(id) < 0; })) kitBeep();
    Kit.lastIds = ids;
    Kit.data = d;
    kitRender();
  } catch (e) {
    if (!silent && $('kitBody')) $('kitBody').innerHTML = '<p class="error">' + esc(e.message) + '</p>';
  } finally {
    Kit.loading = false;
  }
}

/** A short "ding" when a new ticket arrives (works after the first tap on the screen). */
function kitBeep() {
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    Kit.audio = Kit.audio || new C();
    const ctx = Kit.audio, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.25, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.6);
  } catch (e) {}
}

function kitAge(t) {
  if (!t.createdMs) return { text: '', cls: '' };
  const m = Math.max(0, Math.floor((Date.now() - Kit.offset - t.createdMs) / 60000));
  return { text: m < 1 ? 'baru masuk' : 'menunggu ' + m + ' mnt', cls: m >= 25 ? 'late' : m >= 15 ? 'slow' : '' };
}

function kitCard(t, done) {
  const age = kitAge(t);
  const isVoid = t.kind === 'VOID';
  const busy = !!Kit.busy[t.id];
  const head = '<div class="tk-head"><div><span class="tk-table">' + esc(t.table || '-') + '</span>' +
    (t.guest ? '<span class="tk-guest">' + esc(t.guest) + '</span>' : '') + '</div>' +
    '<span class="tk-age ' + (done ? '' : age.cls) + '">' + (done ? '✓ keluar ' + esc(t.doneAt) + (t.serveMin != null ? ' · ' + t.serveMin + ' mnt' : '') + servedTag : esc(age.text)) + '</span></div>' +
    '<div class="tk-meta">' + (isVoid ? '<b>BATAL</b>' : (/^TA-|^Takeaway$/.test(t.table) ? 'Takeaway' : 'Pesanan ' + t.round)) + ' · ' + esc(t.time) +
    (t.by ? ' · ' + esc(t.by) : '') + '</div>';
  const eff = function (i) { const p = Kit.pend[kitPendKey(t.id, i.idx)]; return p === undefined ? i.rdy : p; };
  const dirty = !done && !isVoid && t.items.some(function (i) { return Kit.pend[kitPendKey(t.id, i.idx)] !== undefined; });
  const items = t.items.map(function (i) {
    const row = '<div class="tk-item"><span class="tk-qty">' + i.qty + '×</span><span class="tk-main"><b>' + esc(i.name) + '</b>' +
      (isVoid && i.round ? ' <span class="small">(pesanan ' + i.round + ')</span>' : '') +
      (i.note ? '<span class="tk-note">' + esc(i.note) + '</span>' : '') + '</span>' +
      (done || isVoid ? '<span class="rdy-n">' + (isVoid ? '' : i.rdy + ' / ' + i.qty + ' siap' + (i.srv ? ' · ' + i.srv + ' sudah diantar' : '')) + '</span>' : '') + '</div>';
    if (done || isVoid) return row;
    const cur = eff(i);
    let boxes = '';
    for (let n = 1; n <= i.qty; n++) {
      const sent = n <= i.srv, on = n <= cur, pend = on !== (n <= i.rdy);
      boxes += '<button class="pbox' + (sent ? ' sent' : on ? ' on' : '') + (pend && !sent ? ' pend' : '') + '" type="button" data-act="pbox" data-id="' +
        esc(t.id) + '" data-idx="' + i.idx + '" data-n="' + n + '"' + (sent || busy ? ' disabled' : '') + ' aria-label="porsi ' + n + '">' + (on ? '✓' : '') + '</button>';
    }
    return row + '<div class="pboxes">' + boxes + '<span class="pbox-n">' + cur + ' / ' + i.qty + ' siap</span></div>';
  }).join('');
  const reason = isVoid && t.reason ? '<div class="tk-reason">Alasan: ' + esc(t.reason) + '</div>' : '';
  const allCur = t.items.reduce(function (s, i) { return s + eff(i); }, 0);
  const allTot = t.items.reduce(function (s, i) { return s + i.qty; }, 0);
  const allBtn = '<button class="btn tk-done-alt" type="button" data-act="done" data-id="' + esc(t.id) + '"' + (busy ? ' disabled' : '') + '>' + (busy ? 'Menyimpan…' : 'Semua siap') + '</button>';
  let btn;
  if (done) btn = '<button class="btn small" type="button" data-act="undo" data-id="' + esc(t.id) + '">↶ Kembalikan ke antrian</button>';
  else if (isVoid) btn = '<button class="btn primary tk-done" type="button" data-act="done" data-id="' + esc(t.id) + '">OK, sudah dilihat</button>';
  else if (dirty) btn = '<div class="tk-btns"><button class="btn tk-cancel" type="button" data-act="cancelpend" data-id="' + esc(t.id) + '">Batal</button>' +
    '<button class="btn primary tk-done" type="button" data-act="send" data-id="' + esc(t.id) + '"' + (busy ? ' disabled' : '') + '>' +
    (busy ? 'Mengirim…' : allCur >= allTot ? 'Kirim: semua siap' : 'Kirim ' + allCur + ' dari ' + allTot + ' porsi ke kasir') + '</button></div>';
  else if (t.status === 'PROSES') btn = allBtn;
  else btn = '<div class="tk-btns"><button class="btn tk-start" type="button" data-act="start" data-id="' + esc(t.id) + '">▶ Mulai dibuat</button>' + allBtn + '</div>';
  const partial = t.ready > 0 && t.ready < t.total;
  const stateTag = !done && !isVoid && t.status === 'PROSES'
    ? '<div class="tk-state">' + (partial ? 'Siap sebagian · ' + t.ready + ' dari ' + t.total + ' porsi' : 'Sedang dibuat') + '</div>' : '';
  const servedTag = done && t.status === 'SERVED' ? ' · sudah diantar' : '';
  return '<div class="ticket' + (isVoid ? ' void' : '') + (done ? ' done' : '') + '">' + head + stateTag + '<div class="tk-items">' + items + '</div>' + reason + btn + '</div>';
}

function kitRender() {
  const d = Kit.data;
  if (!d || !$('kitBody')) return;
  const isBar = d.station === 'BAR';
  const sum = d.summary || { portions: 0, tables: 0 };
  const openLabel = isBar ? 'Layar Barista (' + sum.portions + ' minuman)' : 'Antrian (' + d.open.length + ')';
  $('kitTabs').innerHTML = '<button class="chip' + (Kit.tab === 'open' ? ' active' : '') + '" type="button" data-act="tab" data-t="open">' + openLabel + '</button>' +
    '<button class="chip' + (Kit.tab === 'done' ? ' active' : '') + '" type="button" data-act="tab" data-t="done">Selesai hari ini (' + d.done.length + ')</button>';
  const now = new Date();
  kitBadgeSet(isBar ? sum.portions : d.open.length, d.open.filter(function (t) { return kitAge(t).cls; }).length);
  if (isBar && KitBadge.c) KitBadge.c.BAR_TABLES = sum.tables;
  $('kitStamp').textContent = KIT_NAMES[d.station] + ' · diperbarui ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  const list = Kit.tab === 'open' ? d.open : d.done;
  const summaryHtml = isBar && Kit.tab === 'open' && sum.portions
    ? '<div class="kit-sum">' + sum.tables + ' meja · ' + sum.portions + ' minuman belum selesai</div>' : '';
  $('kitBody').innerHTML = summaryHtml + (list.length ? list.map(function (t) { return kitCard(t, Kit.tab === 'done'); }).join('')
    : '<div class="empty">' + (Kit.tab === 'open' ? 'Belum ada pesanan. Layar ini memuat ulang sendiri setiap 15 detik.' : 'Belum ada yang selesai hari ini.') + '</div>');
}

async function kitStart(id) {
  if (Kit.busy[id]) return;
  const t = Kit.data.open.filter(function (x) { return x.id === id; })[0];
  if (t) { t.status = 'PROSES'; kitRender(); }      // changes at once; the server confirms below
  Kit.busy[id] = true;
  try {
    await api('apiKitchenStart', App.token, id, Kit.station);
  } catch (e) {
    if (t) t.status = 'NEW';
    toast(e.message, 'err');
  } finally {
    delete Kit.busy[id];
    kitRender();
    kitLoad(true);
  }
}

async function kitDone(id, undo) {
  if (Kit.busy[id]) return;
  if (!undo) kitClearPend(id);
  const prev = { open: Kit.data.open.slice(), done: Kit.data.done.slice() };
  const from = undo ? Kit.data.done : Kit.data.open;
  const t = from.filter(function (x) { return x.id === id; })[0];
  Kit.busy[id] = true;
  if (t) {                                            // the screen changes at once; the server confirms below
    if (undo) { Kit.data.done = Kit.data.done.filter(function (x) { return x !== t; }); Kit.data.open.push(t); }
    else { Kit.hide[id] = true; Kit.data.open = Kit.data.open.filter(function (x) { return x !== t; }); t.doneAt = new Date().toTimeString().slice(0, 5); Kit.data.done.unshift(t); }
    Kit.lastIds = Kit.data.open.map(function (x) { return x.id; });
    kitRender();
  }
  try {
    await api('apiKitchenDone', App.token, id, Kit.station, undo);
  } catch (e) {
    delete Kit.hide[id];
    Kit.data.open = prev.open; Kit.data.done = prev.done;
    toast(e.message, 'err');
    kitRender();
  } finally {
    delete Kit.busy[id];
    kitLoad(true);
  }
}

/* ----- Siap sebagian: ketuk kotak porsi (hanya di layar, belum terkirim), lalu "Kirim ke kasir" ----- */
function kitPendKey(id, idx) { return id + '|' + idx; }

function kitTicket(id) {
  const d = Kit.data;
  return d && [].concat(d.open, d.done).filter(function (x) { return x.id === id; })[0];
}

/** Ketuk porsi n: kalau sudah centang, porsi n dan seterusnya dibatalkan; kalau belum, centang sampai n. */
function kitToggleBox(id, idx, n) {
  if (Kit.busy[id]) return;
  const t = kitTicket(id);
  const item = t && t.items.filter(function (i) { return i.idx === idx; })[0];
  if (!item) return;
  const k = kitPendKey(id, idx);
  const cur = Kit.pend[k] === undefined ? item.rdy : Kit.pend[k];
  const next = Math.max(item.srv, cur >= n ? n - 1 : n);
  if (next === item.rdy) delete Kit.pend[k];
  else Kit.pend[k] = next;
  kitRender();
}

function kitClearPend(id) {
  Object.keys(Kit.pend).forEach(function (k) { if (k.indexOf(id + '|') === 0) delete Kit.pend[k]; });
}

/** Kirim porsi yang sudah dicentang ke kasir (satu panggilan per item yang berubah). */
async function kitSendPending(id) {
  const t = kitTicket(id);
  if (!t || Kit.busy[id]) return;
  const todo = t.items.filter(function (i) { return Kit.pend[kitPendKey(id, i.idx)] !== undefined; });
  Kit.busy[id] = true;
  kitRender();
  try {
    await Promise.all(todo.map(function (i) {
      return api('apiKitchenSetReady', App.token, id, Kit.station, i.idx, Kit.pend[kitPendKey(id, i.idx)]);
    }));
    todo.forEach(function (i) { i.rdy = Kit.pend[kitPendKey(id, i.idx)]; });
    kitClearPend(id);
    const cur = t.items.reduce(function (s, i) { return s + i.rdy; }, 0);
    const tot = t.items.reduce(function (s, i) { return s + i.qty; }, 0);
    toast(cur >= tot ? 'Semua porsi siap · kasir sudah diberi tahu' : cur + ' dari ' + tot + ' porsi siap · kasir sudah diberi tahu');
  } catch (e) {
    kitClearPend(id);
    toast(e.message, 'err');
  } finally {
    delete Kit.busy[id];
    kitRender();
  }
  kitLoad(true);
}

/* ----- Siap Diantar (kasir / server): hanya yang harus diantar sekarang; "Semua pesanan" untuk melihat sisanya ----- */
const Serve = { data: null, view: 'ready', focus: null, timer: null, lastKeys: null, loading: false, offset: 0, busy: {}, hide: {} };
const SERVE_STAT = { NEW: 'belum dimulai', PROSES: 'sedang dibuat', PART: 'sebagian siap', DONE: 'siap', SERVED: 'sudah diantar' };
const SERVE_CLS = { NEW: 'muted', PROSES: 'info', PART: 'info', DONE: 'ready', SERVED: 'good' };

/** Status of one item line, e.g. "2 sudah diantar · 1 siap diantar · 1 belum siap". */
function serveLineLabel(i) {
  const parts = [];
  if (i.srv) parts.push(i.srv + ' sudah diantar');
  if (i.rdy - i.srv > 0) parts.push((i.rdy - i.srv) + ' siap diantar');
  if (i.qty - i.rdy > 0) parts.push((i.qty - i.rdy) + ' belum siap');
  return parts.length ? parts.join(' · ') : SERVE_STAT[i.status];
}

function hhmm(d) { return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

App.resetHooks.push(function () { Serve.data = null; Serve.lastKeys = null; });

Views.serve = function () { serveShow(); };

function serveShow() {
  Mod.render('<div class="kit-top"><button class="btn small" type="button" data-act="home">‹ Beranda</button>' +
    '<span class="sv-title" id="serveTitle"></span>' +
    '<div class="tools-right"><button class="btn small" type="button" data-act="toggle" id="serveSwitch"></button>' +
    '<button class="btn small" type="button" data-act="reload">↻</button></div></div>' +
    '<div class="small muted" id="serveStamp"></div>' +
    '<div class="kds" id="serveBody"><div class="empty">Memuat…</div></div>');
  Mod.on({
    home: function () { go('home'); },
    reload: function () { serveLoad(false); },
    toggle: function () { Serve.view = Serve.view === 'ready' ? 'all' : 'ready'; Serve.focus = null; serveRender(); },
    table: function (el) { Serve.focus = el.dataset.order; Serve.view = 'all'; serveRender(); },
    serve: function (el) { serveDelivered(el.dataset.order, el.dataset.round, el); }
  });
  serveLoad(false);
  if (!Serve.timer) {
    Serve.timer = setInterval(function () {
      if (App.view === 'serve' && !document.hidden && App.token) serveLoad(true);
      else if (App.view !== 'serve') { clearInterval(Serve.timer); Serve.timer = null; }
    }, 15000);
  }
}

async function serveLoad(silent) {
  if (Serve.loading) return;
  Serve.loading = true;
  try {
    const d = await api('apiGetServe', App.token);
    if (App.view !== 'serve' || !$('serveBody')) return;
    Serve.offset = Date.now() - d.serverNow;
    const readyKeys = d.ready.map(function (r) { return r.orderId + '|' + r.round; });
    Object.keys(Serve.hide).forEach(function (k) { if (readyKeys.indexOf(k) < 0) delete Serve.hide[k]; });
    d.ready = d.ready.filter(function (r) { return !Serve.hide[r.orderId + '|' + r.round]; });
    const keys = d.ready.map(function (r) { return r.orderId + '|' + r.round; });
    if (Serve.lastKeys && keys.some(function (k) { return Serve.lastKeys.indexOf(k) < 0; })) kitBeep();
    Serve.lastKeys = keys;
    Serve.data = d;
    if (KitBadge.c) { KitBadge.c.READY = d.ready.length; kitBadgeRender(); }
    serveRender();
  } catch (e) {
    if (!silent && $('serveBody')) $('serveBody').innerHTML = '<p class="error">' + esc(e.message) + '</p>';
  } finally {
    Serve.loading = false;
  }
}

function serveRender() {
  const d = Serve.data;
  if (!d || !$('serveBody')) return;
  $('serveStamp').textContent = 'diperbarui ' + hhmm(new Date());
  if (Serve.view === 'ready') {
    const cards = d.ready.map(serveReadyCard).filter(Boolean);
    $('serveTitle').textContent = 'Siap diantar' + (cards.length ? ' · ' + cards.length + ' pesanan' : '');
    $('serveSwitch').textContent = 'Semua pesanan ›';
    $('serveBody').innerHTML = cards.length ? cards.join('')
      : '<div class="empty">Belum ada yang siap diantar. Layar ini memuat ulang sendiri setiap 15 detik.</div>';
  } else {
    const rounds = d.all.filter(function (r) { return !Serve.focus || r.orderId === Serve.focus; });
    const one = Serve.focus && rounds[0];
    $('serveTitle').textContent = one ? 'Meja ' + (one.table || '-') : 'Semua pesanan';
    $('serveSwitch').textContent = '‹ Siap diantar';
    $('serveBody').innerHTML = rounds.length ? serveAllHtml(rounds)
      : '<div class="empty">Belum ada pesanan meja yang terbuka.</div>';
  }
}

/** Satu kartu = satu pesanan (ronde) meja yang siap diantar. Hanya porsi yang harus diantar sekarang. */
function serveReadyCard(r) {
  const go = r.lines.filter(function (l) { return l.rdy > l.srv; });
  if (!go.length) return '';
  const portions = go.reduce(function (s, l) { return s + (l.rdy - l.srv); }, 0);
  const waiting = r.lines.filter(function (l) { return l.rdy < l.qty; });
  const m = Math.max(0, Math.floor((Date.now() - Serve.offset - (r.readyStamped ? r.readyMs : r.createdMs)) / 60000));
  const lines = go.map(function (l) {
    return '<div class="sv-line"><span class="sv-qty">' + (l.rdy - l.srv) + '×</span><span class="sv-name">' + esc(l.name) + '</span>' +
      (l.note ? '<span class="tk-note">' + esc(l.note) + '</span>' : '') + '</div>';
  }).join('');
  const left = waiting.length ? '<div class="small muted sv-wait">Masih dibuat: ' +
    waiting.map(function (l) { return (l.qty - l.rdy) + '× ' + esc(l.name); }).join(', ') + '</div>' : '';
  return '<div class="ticket">' +
    '<div class="tk-head"><div><span class="tk-table">' + esc(r.table || '-') + '</span>' +
    (r.guest ? '<span class="tk-guest">' + esc(r.guest) + '</span>' : '') + '</div>' +
    '<span class="tk-age">masuk ' + esc(r.time) + '</span></div>' +
    '<div class="tk-meta">Pesanan ' + r.round + ' · ' + (r.readyStamped ? 'siap ' + esc(r.readyAt) + ' (' + m + ' mnt lalu)' : 'sebagian siap · ' + m + ' mnt lalu') + '</div>' +
    '<div class="tk-items">' + lines + '</div>' + left +
    '<button class="btn small sv-more" type="button" data-act="table" data-order="' + esc(r.orderId) + '">Pesanan lain di ' + esc(r.table || 'meja') + ' ›</button>' +
    '<button class="btn primary tk-done" type="button" data-act="serve" data-order="' + esc(r.orderId) + '" data-round="' + r.round + '"' + (Serve.busy[r.orderId + '|' + r.round] ? ' disabled' : '') + '>' +
    (Serve.busy[r.orderId + '|' + r.round] ? 'Menyimpan…' : '✓ Sudah diantar (' + portions + ' porsi)') + '</button>' +
    '</div>';
}

/** Semua pesanan: per meja, per ronde, status dan waktu tiap item. */
function serveAllHtml(rounds) {
  const byOrder = {}, order = [];
  rounds.forEach(function (r) {
    if (!byOrder[r.orderId]) { byOrder[r.orderId] = { table: r.table, guest: r.guest, rounds: [] }; order.push(r.orderId); }
    byOrder[r.orderId].rounds.push(r);
  });
  return order.map(function (oid) {
    const o = byOrder[oid];
    const rs = o.rounds.map(function (r) {
      return '<div class="sv-round"><div class="sv-rhead"><b>Pesanan ' + r.round + '</b> · masuk ' + esc(r.time) +
        (r.readyStamped ? ' · siap ' + esc(r.readyAt) : '') + '</div>' + r.lines.map(serveAllLine).join('') +
        (r.state === 'READY' ? '<button class="btn small sv-serve" type="button" data-act="serve" data-order="' + esc(r.orderId) + '" data-round="' + r.round + '">✓ Sudah diantar</button>' : '') + '</div>';
    }).join('');
    return '<div class="ticket sv-table"><div class="tk-head"><div><span class="tk-table">' + esc(o.table || '-') + '</span>' +
      (o.guest ? '<span class="tk-guest">' + esc(o.guest) + '</span>' : '') + '</div></div>' + rs + '</div>';
  }).join('');
}

/**
 * One item in the table view. Two things only:
 *  - what must still go out now (bold), or "semua sudah diantar"
 *  - every delivery with its own time, e.g. "✓ 2 diantar 17:30 · ✓ 2 diantar 17:40"
 */
function serveAllLine(l) {
  const go = l.rdy - l.srv, cooking = l.qty - l.rdy;
  let now;
  if (l.srv >= l.qty) now = '<span class="sv-ok">✓ semua sudah diantar</span>';
  else {
    const parts = [];
    if (go > 0) parts.push('<b class="sv-go">Antar ' + go + ' sekarang</b>');
    if (cooking > 0) parts.push('<span class="sv-wait-n">' + cooking + ' masih dibuat</span>');
    now = parts.join(' · ') || '<span class="muted">' + SERVE_STAT[l.status] + '</span>';
  }
  const log = (l.serves || []).filter(function (s) { return s.n > 0; })
    .map(function (s) { return '<span class="sv-chip">✓ ' + s.n + ' diantar ' + esc(s.at || '-') + '</span>'; }).join('');
  return '<div class="sv-line' + (l.status === 'SERVED' ? ' served' : '') + '">' +
    '<div class="sv-main"><span class="sv-qty">' + l.qty + '×</span><span class="sv-name">' + esc(l.name) + '</span>' +
    '<span class="sv-station">' + (l.st === 'FOOD' ? 'Dapur' : 'Bar') + '</span></div>' +
    '<div class="sv-now">' + now + '</div>' +
    (log ? '<div class="sv-log">' + log + '</div>' : '') +
    (l.note ? '<div class="tk-note">' + esc(l.note) + '</div>' : '') + '</div>';
}

async function serveDelivered(orderId, round, el) {
  const key = orderId + '|' + round;
  if (Serve.busy[key]) return;
  Serve.busy[key] = true;
  Serve.hide[key] = true;                                 // the card leaves at once; the server confirms below
  const prev = Serve.data.ready;
  Serve.data.ready = prev.filter(function (r) { return r.orderId + '|' + r.round !== key; });
  if (KitBadge.c) { KitBadge.c.READY = Serve.data.ready.length; kitBadgeRender(); }
  serveRender();
  try {
    await api('apiServeRound', App.token, orderId, Number(round));
    toast('Pesanan ' + round + ' sudah diantar.');
  } catch (e) {
    delete Serve.hide[key];
    Serve.data.ready = prev;
    if (KitBadge.c) { KitBadge.c.READY = prev.length; kitBadgeRender(); }
    serveRender();
    toast(e.message, 'err');
  } finally {
    delete Serve.busy[key];
    serveLoad(true);
  }
}
</script>
