<script>
/* ================= KitchenJs: Layar Dapur / Layar Bar (order tickets) ================= */

const Kit = { station: null, data: null, tab: 'open', timer: null, lastIds: null, offset: 0, loading: false };
const KIT_NAMES = { FOOD: 'Dapur', BAR: 'Bar' };

App.resetHooks.push(function () { Kit.station = null; Kit.data = null; Kit.lastIds = null; kitBadgeStop(); });

/* ----- top-bar counter: how many tickets wait for this user's screen (Dapur / Bar) ----- */
const KitBadge = { timer: null, c: null };

function kitBadgeStart() {
  if (!(can('kitchen.food') || can('kitchen.bar') || can('tables.serve'))) return;
  kitBadgeLoad();
  if (!KitBadge.timer) KitBadge.timer = setInterval(function () { if (App.token && !document.hidden) kitBadgeLoad(); }, 20000);
}

function kitBadgeStop() {
  if (KitBadge.timer) { clearInterval(KitBadge.timer); KitBadge.timer = null; }
  KitBadge.c = null;
  kitBadgeRender();
}

async function kitBadgeLoad() {
  try { KitBadge.c = await api('apiKitchenCount', App.token); kitBadgeRender(); } catch (e) {}
}

/** Used by the open screen too, so the counter matches what is on the screen. */
function kitBadgeSet(open, late) {
  if (Kit.station === 'FOOD' && KitBadge.c) KitBadge.c.FOOD = open;
  if (Kit.station === 'BAR' && KitBadge.c) KitBadge.c.BAR = open;
  if (KitBadge.c) KitBadge.c.late = late;
  kitBadgeRender();
}

function kitBadgeRender() {
  const pill = $('kitPill');
  if (!pill) return;
  const c = KitBadge.c;
  const parts = [];                       // each part opens its own screen (see HomeJs)
  if (c && c.FOOD !== null) parts.push('<span data-go="kitchen">Dapur ' + c.FOOD + '</span>');
  if (c && c.BAR !== null) parts.push('<span data-go="bar_orders">Bar ' + c.BAR + '</span>');
  if (c && c.READY !== null && c.READY !== undefined) parts.push('<span data-go="serve">Siap diantar ' + c.READY + '</span>');
  pill.hidden = !parts.length;
  pill.innerHTML = parts.join(' · ') + (c && c.late ? ' <b class="kit-late">⚠ ' + c.late + '</b>' : '');
  pill.classList.toggle('late', !!(c && c.late));
}

Views.kitchen = function () { kitShow('FOOD'); };
Views.bar_orders = function () { kitShow('BAR'); };

function kitShow(station) {
  if (Kit.station !== station) { Kit.lastIds = null; Kit.tab = 'open'; Kit.data = null; }
  Kit.station = station;
  Mod.render('<div class="kit-top"><div class="filter-bar" id="kitTabs"></div>' +
    '<div class="tools-right"><span class="small muted" id="kitStamp"></span><button class="btn small" type="button" data-act="reload">↻</button></div></div>' +
    '<div class="kds" id="kitBody"><div class="empty">Memuat…</div></div>');
  Mod.on({
    reload: function () { kitLoad(false); },
    tab: function (el) { Kit.tab = el.dataset.t; kitRender(); },
    done: function (el) { kitDone(el.dataset.id, false); },
    undo: function (el) { kitDone(el.dataset.id, true); },
    start: function (el) { kitStart(el.dataset.id); }
  });
  kitLoad(false);
  if (!Kit.timer) {
    Kit.timer = setInterval(function () {
      if ((App.view === 'kitchen' || App.view === 'bar_orders') && !document.hidden && App.token) kitLoad(true);
      else if (App.view !== 'kitchen' && App.view !== 'bar_orders') { clearInterval(Kit.timer); Kit.timer = null; }
    }, 15000);
  }
}

async function kitLoad(silent) {
  if (Kit.loading) return;
  Kit.loading = true;
  const station = Kit.station;
  try {
    const d = await api('apiGetKitchen', App.token, station);
    if (station !== Kit.station || !$('kitBody')) return;
    Kit.offset = Date.now() - d.serverNow;
    const ids = d.open.map(function (t) { return t.id; });
    if (Kit.lastIds && ids.some(function (id) { return Kit.lastIds.indexOf(id) < 0; })) kitBeep();
    Kit.lastIds = ids;
    Kit.data = d;
    kitRender();
  } catch (e) {
    if (!silent && $('kitBody')) $('kitBody').innerHTML = '<p class="error">' + esc(e.message) + '</p>';
  } finally {
    Kit.loading = false;
  }
}

/** A short "ding" when a new ticket arrives (works after the first tap on the screen). */
function kitBeep() {
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    Kit.audio = Kit.audio || new C();
    const ctx = Kit.audio, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.25, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.6);
  } catch (e) {}
}

function kitAge(t) {
  if (!t.createdMs) return { text: '', cls: '' };
  const m = Math.max(0, Math.floor((Date.now() - Kit.offset - t.createdMs) / 60000));
  return { text: m < 1 ? 'baru masuk' : 'menunggu ' + m + ' mnt', cls: m >= 25 ? 'late' : m >= 15 ? 'slow' : '' };
}

function kitCard(t, done) {
  const age = kitAge(t);
  const isVoid = t.kind === 'VOID';
  const head = '<div class="tk-head"><div><span class="tk-table">' + esc(t.table || '-') + '</span>' +
    (t.guest ? '<span class="tk-guest">' + esc(t.guest) + '</span>' : '') + '</div>' +
    '<span class="tk-age ' + (done ? '' : age.cls) + '">' + (done ? '✓ keluar ' + esc(t.doneAt) + (t.serveMin != null ? ' · ' + t.serveMin + ' mnt' : '') + servedTag : esc(age.text)) + '</span></div>' +
    '<div class="tk-meta">' + (isVoid ? '<b>BATAL</b>' : (t.table === 'Takeaway' ? 'Takeaway' : 'Pesanan ' + t.round)) + ' · ' + esc(t.time) +
    (t.by ? ' · ' + esc(t.by) : '') + '</div>';
  const items = t.items.map(function (i) {
    return '<div class="tk-item"><span class="tk-qty">' + i.qty + '×</span><span><b>' + esc(i.name) + '</b>' +
      (isVoid && i.round ? ' <span class="small">(pesanan ' + i.round + ')</span>' : '') +
      (i.note ? '<span class="tk-note">' + esc(i.note) + '</span>' : '') + '</span></div>';
  }).join('');
  const reason = isVoid && t.reason ? '<div class="tk-reason">Alasan: ' + esc(t.reason) + '</div>' : '';
  let btn;
  if (done) btn = '<button class="btn small" type="button" data-act="undo" data-id="' + esc(t.id) + '">↶ Kembalikan ke antrian</button>';
  else if (isVoid) btn = '<button class="btn primary tk-done" type="button" data-act="done" data-id="' + esc(t.id) + '">OK, sudah dilihat</button>';
  else if (t.status === 'PROSES') btn = '<button class="btn primary tk-done" type="button" data-act="done" data-id="' + esc(t.id) + '">✓ Siap diantar</button>';
  else btn = '<div class="tk-btns"><button class="btn tk-start" type="button" data-act="start" data-id="' + esc(t.id) + '">▶ Mulai dibuat</button>' +
    '<button class="btn primary tk-done" type="button" data-act="done" data-id="' + esc(t.id) + '">✓ Siap</button></div>';
  const stateTag = !done && !isVoid && t.status === 'PROSES' ? '<div class="tk-state">Sedang dibuat</div>' : '';
  const servedTag = done && t.status === 'SERVED' ? ' · sudah diantar' : '';
  return '<div class="ticket' + (isVoid ? ' void' : '') + (done ? ' done' : '') + '">' + head + stateTag + '<div class="tk-items">' + items + '</div>' + reason + btn + '</div>';
}

function kitRender() {
  const d = Kit.data;
  if (!d || !$('kitBody')) return;
  $('kitTabs').innerHTML = '<button class="chip' + (Kit.tab === 'open' ? ' active' : '') + '" type="button" data-act="tab" data-t="open">Antrian (' + d.open.length + ')</button>' +
    '<button class="chip' + (Kit.tab === 'done' ? ' active' : '') + '" type="button" data-act="tab" data-t="done">Selesai hari ini (' + d.done.length + ')</button>';
  const now = new Date();
  kitBadgeSet(d.open.length, d.open.filter(function (t) { return kitAge(t).cls; }).length);
  $('kitStamp').textContent = KIT_NAMES[d.station] + ' · diperbarui ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  const list = Kit.tab === 'open' ? d.open : d.done;
  $('kitBody').innerHTML = list.length ? list.map(function (t) { return kitCard(t, Kit.tab === 'done'); }).join('')
    : '<div class="empty">' + (Kit.tab === 'open' ? 'Belum ada pesanan. Layar ini memuat ulang sendiri setiap 15 detik.' : 'Belum ada yang selesai hari ini.') + '</div>';
}

async function kitStart(id) {
  try {
    await api('apiKitchenStart', App.token, id, Kit.station);
    const t = Kit.data.open.filter(function (x) { return x.id === id; })[0];
    if (t) { t.status = 'PROSES'; kitRender(); }
    kitLoad(true);
  } catch (e) { toast(e.message, 'err'); kitLoad(true); }
}

async function kitDone(id, undo) {
  try {
    await api('apiKitchenDone', App.token, id, Kit.station, undo);
    const from = undo ? Kit.data.done : Kit.data.open;
    const t = from.filter(function (x) { return x.id === id; })[0];
    if (t) {                       // update the screen right away, then refresh from the server
      if (undo) { Kit.data.done = Kit.data.done.filter(function (x) { return x !== t; }); Kit.data.open.push(t); }
      else { Kit.data.open = Kit.data.open.filter(function (x) { return x !== t; }); t.doneAt = new Date().toTimeString().slice(0, 5); Kit.data.done.unshift(t); }
      Kit.lastIds = Kit.data.open.map(function (x) { return x.id; });
      kitRender();
    }
    kitLoad(true);
  } catch (e) {
    toast(e.message, 'err');
  }
}

/* ----- Layar Siap Diantar (kasir / server): pesanan per meja yang sudah siap atau masih dibuat ----- */
const Serve = { data: null, tab: 'ready', timer: null, lastKeys: null, loading: false, offset: 0 };
const SERVE_STAT = { NEW: 'belum dimulai', PROSES: 'sedang dibuat', DONE: 'siap', SERVED: 'sudah diantar' };
const SERVE_CLS = { NEW: 'muted', PROSES: 'info', DONE: 'ready', SERVED: 'good' };

App.resetHooks.push(function () { Serve.data = null; Serve.lastKeys = null; });

Views.serve = function () { serveShow(); };

function serveShow() {
  Mod.render('<div class="kit-top"><div class="filter-bar" id="serveTabs"></div>' +
    '<div class="tools-right"><span class="small muted" id="serveStamp"></span><button class="btn small" type="button" data-act="reload">↻</button></div></div>' +
    '<div class="kds" id="serveBody"><div class="empty">Memuat…</div></div>');
  Mod.on({
    reload: function () { serveLoad(false); },
    tab: function (el) { Serve.tab = el.dataset.t; serveRender(); },
    serve: function (el) { serveDelivered(el.dataset.order, el.dataset.round, el); }
  });
  serveLoad(false);
  if (!Serve.timer) {
    Serve.timer = setInterval(function () {
      if (App.view === 'serve' && !document.hidden && App.token) serveLoad(true);
      else if (App.view !== 'serve') { clearInterval(Serve.timer); Serve.timer = null; }
    }, 15000);
  }
}

async function serveLoad(silent) {
  if (Serve.loading) return;
  Serve.loading = true;
  try {
    const d = await api('apiGetServe', App.token);
    if (App.view !== 'serve' || !$('serveBody')) return;
    Serve.offset = Date.now() - d.serverNow;
    const keys = d.ready.map(function (r) { return r.orderId + '|' + r.round; });
    if (Serve.lastKeys && keys.some(function (k) { return Serve.lastKeys.indexOf(k) < 0; })) kitBeep();
    Serve.lastKeys = keys;
    Serve.data = d;
    if (KitBadge.c) { KitBadge.c.READY = d.ready.length; kitBadgeRender(); }
    serveRender();
  } catch (e) {
    if (!silent && $('serveBody')) $('serveBody').innerHTML = '<p class="error">' + esc(e.message) + '</p>';
  } finally {
    Serve.loading = false;
  }
}

function serveRender() {
  const d = Serve.data;
  if (!d || !$('serveBody')) return;
  $('serveTabs').innerHTML = '<button class="chip' + (Serve.tab === 'ready' ? ' active' : '') + '" type="button" data-act="tab" data-t="ready">Siap diantar (' + d.ready.length + ')</button>' +
    '<button class="chip' + (Serve.tab === 'cooking' ? ' active' : '') + '" type="button" data-act="tab" data-t="cooking">Sedang dibuat (' + d.cooking.length + ')</button>';
  const now = new Date();
  $('serveStamp').textContent = 'diperbarui ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  const ready = Serve.tab === 'ready';
  const list = ready ? d.ready : d.cooking;
  $('serveBody').innerHTML = list.length ? list.map(serveCard).join('')
    : '<div class="empty">' + (ready ? 'Belum ada pesanan yang siap diantar. Layar ini memuat ulang sendiri setiap 15 detik.' : 'Tidak ada pesanan yang sedang dibuat.') + '</div>';
}

/** One table round: table, guest, round, status per station, every item, and the delivered button. */
function serveCard(r) {
  const ready = r.state === 'READY';
  const since = ready ? r.readyMs : r.createdMs;
  const m = Math.max(0, Math.floor((Date.now() - Serve.offset - since) / 60000));
  const age = ready ? 'siap ' + (m < 1 ? 'baru saja' : m + ' mnt lalu') : (m < 1 ? 'baru masuk' : 'menunggu ' + m + ' mnt');
  const cls = m >= 25 ? 'late' : m >= 15 ? 'slow' : '';
  const sts = r.stations;
  const head = '<div class="tk-head"><div><span class="tk-table">' + esc(r.table || '-') + '</span>' +
    (r.guest ? '<span class="tk-guest">' + esc(r.guest) + '</span>' : '') + '</div>' +
    '<span class="tk-age ' + (ready ? '' : cls) + '">' + esc(age) + '</span></div>';
  const meta = '<div class="tk-meta"><b>Pesanan ' + r.round + '</b> · masuk ' + esc(r.time) + (r.by ? ' · ' + esc(r.by) : '') + '</div>';
  const stLine = '<div class="round-status serve-stations">' + Object.keys(sts).map(function (k) {
    return '<span class="rs-line"><span class="pill ' + SERVE_CLS[sts[k]] + '">' + (k === 'FOOD' ? 'Dapur' : 'Bar') + '</span>' + SERVE_STAT[sts[k]] + '</span>';
  }).join('') + '</div>';
  const items = r.lines.map(function (i) {
    return '<div class="tk-item serve-item' + (i.status === 'SERVED' ? ' served' : '') + '"><span class="tk-qty">' + i.qty + '×</span><span><b>' + esc(i.name) + '</b>' +
      '<span><span class="pill ' + SERVE_CLS[i.status] + ' serve-st">' + (i.st === 'FOOD' ? 'Dapur' : 'Bar') + ' · ' + SERVE_STAT[i.status] + '</span></span>' +
      (i.note ? '<span class="tk-note">' + esc(i.note) + '</span>' : '') + '</span></div>';
  }).join('');
  let btn = '';
  if (ready) {
    const left = Object.keys(sts).filter(function (k) { return sts[k] === 'NEW' || sts[k] === 'PROSES'; });
    btn = '<button class="btn primary tk-done" type="button" data-act="serve" data-order="' + esc(r.orderId) + '" data-round="' + r.round + '">✓ Sudah diantar' +
      (left.length ? ' (yang siap)' : '') + '</button>' +
      (left.length ? '<div class="small muted">' + left.map(function (k) { return k === 'FOOD' ? 'Dapur' : 'Bar'; }).join(' & ') + ' belum siap</div>' : '');
  }
  return '<div class="ticket">' + head + meta + stLine + '<div class="tk-items">' + items + '</div>' + btn + '</div>';
}

async function serveDelivered(orderId, round, el) {
  if (el) el.disabled = true;
  try {
    await api('apiServeRound', App.token, orderId, Number(round));
    toast('Pesanan ' + round + ' sudah diantar.');
  } catch (e) {
    toast(e.message, 'err');
    if (el) el.disabled = false;
  }
  serveLoad(true);
}
</script>
