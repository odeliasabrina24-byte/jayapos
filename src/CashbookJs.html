<script>
/* ---------------- Jurnal Kas ---------------- */
Views.cashbook = function () { cashView(); };

const KAS_MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

function kasDate(ds) {
  const p = String(ds || '').split('-');
  return p.length === 3 ? Number(p[2]) + ' ' + KAS_MONTHS[Number(p[1]) - 1] + ' ' + p[0] : String(ds || '');
}

function kasAmt(v) {
  const t = String(v == null ? '' : v).trim();
  if (!t) return 0;
  const n = bankNum(t);
  if (!(n >= 0)) throw new Error('Nominal harus angka, contoh 150000 atau 150000,50.');
  return n;
}

let KasState = { month: null, data: null };

async function cashView(month) {
  try {
    if (month) KasState.month = month;
    KasState.data = await api('apiGetCashbook', App.token, { month: KasState.month });
    const d = KasState.data;
    const rowsHtml = d.entries.length ? d.entries.map(function (e) {
      return '<tr' + (d.canEdit ? ' class="clickable" data-act="open" data-id="' + esc(e.id) + '"' : '') + '>' +
        '<td>' + esc(kasDate(e.date)) + '</td><td>' + esc(e.desc) + '</td><td>' + esc(e.category) + '</td>' +
        '<td>' + esc(e.accountLabel) + '</td>' +
        '<td class="num">' + (e.in ? bankRp(e.in) : '-') + '</td>' +
        '<td class="num">' + (e.out ? bankRp(e.out) : '-') + '</td>' +
        '<td>' + esc(e.proof || '-') + '</td></tr>';
    }).join('') : '';
    const table = d.entries.length
      ? '<div class="table-scroll"><table class="data"><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Kategori</th><th>Akun</th>' +
        '<th class="num">Masuk</th><th class="num">Keluar</th><th>No. bukti</th></tr></thead><tbody>' + rowsHtml + '</tbody></table></div>'
      : '<div class="empty">Belum ada transaksi di bulan ini.</div>';
    const accRows = d.perAccount.map(function (a) {
      return '<tr><td>' + esc(a.label) + '</td><td class="num">' + a.count + '</td><td class="num">' + bankRp(a.in) +
        '</td><td class="num">' + bankRp(a.out) + '</td><td class="num">' + bankRpSigned(a.net) + '</td></tr>';
    }).join('');
    const html =
      '<div class="toolbar"><input type="month" id="kasMonth" value="' + esc(d.month) + '">' +
      (d.canEdit ? '<button class="btn primary" type="button" data-act="add">+ Catat transaksi</button>' +
        '<button class="btn" type="button" data-act="cats">Kelola kategori</button>' : '') + '</div>' +
      '<div class="kpis">' + kpi('Masuk', bankRp(d.totals.in)) + kpi('Keluar', bankRp(d.totals.out)) +
      kpi('Selisih bulan ini', bankRpSigned(d.totals.net)) + '</div>' +
      '<p class="note-line">Selisih = masuk − keluar dalam bulan ini. Saldo awal belum dicatat, jadi ini hanya arus kas bulan ini.</p>' +
      table +
      '<h3 style="margin:18px 0 6px">Per akun</h3>' +
      '<div class="table-scroll"><table class="data"><thead><tr><th>Akun</th><th class="num">Jml</th><th class="num">Masuk</th>' +
      '<th class="num">Keluar</th><th class="num">Selisih</th></tr></thead><tbody>' + accRows + '</tbody></table></div>';
    Mod.render(html);
    Mod.on({
      _change: function (el) { if (el.id === 'kasMonth' && el.value) cashView(el.value); },
      add: function () { kasEntryForm(null); },
      open: function (el) {
        const e = KasState.data.entries.filter(function (x) { return x.id === el.dataset.id; })[0];
        if (e) kasEntryForm(e);
      },
      cats: function () { kasCategoryManager(); }
    });
  } catch (e) {
    Mod.render('<p class="error">' + esc(e.message) + '</p>');
  }
}

function kasEntryForm(e) {
  const cats = KasState.data.categories.filter(function (c) { return c.active || (e && c.name === e.category); });
  if (e && !cats.some(function (c) { return c.name === e.category; })) cats.push({ name: e.category });
  openForm({
    title: e ? 'Ubah transaksi' : 'Catat transaksi',
    fields: [
      { name: 'date', label: 'Tanggal', type: 'text', value: e ? e.date : todayISO(), help: 'Format yyyy-mm-dd' },
      { name: 'desc', label: 'Keterangan', type: 'text', value: e ? e.desc : '', help: 'contoh: beli telur 5 kg di Pasar Badung' },
      { name: 'category', label: 'Kategori', type: 'select', value: e ? e.category : (cats[0] && cats[0].name),
        options: cats.map(function (c) { return { value: c.name, label: c.name }; }) },
      { name: 'account', label: 'Akun', type: 'select', value: e ? e.account : 'KAS_LACI',
        options: KasState.data.accounts.map(function (a) { return { value: a.code, label: a.label }; }) },
      { name: 'in', label: 'Masuk (Rp)', type: 'text', value: e && e.in ? String(e.in).replace('.', ',') : '', help: 'Isi kalau uang masuk. Kalau keluar, kosongkan' },
      { name: 'out', label: 'Keluar (Rp)', type: 'text', value: e && e.out ? String(e.out).replace('.', ',') : '', help: 'Isi kalau uang keluar. Kalau masuk, kosongkan' },
      { name: 'proof', label: 'No. bukti', type: 'text', value: e ? e.proof : '', help: 'nomor nota, struk, atau bukti transfer. Boleh kosong' }
    ],
    onSubmit: async function (v) {
      const money_in = kasAmt(v.in), money_out = kasAmt(v.out);
      await api('apiSaveCashEntry', App.token, {
        id: e ? e.id : '', date: v.date, desc: v.desc, category: v.category, account: v.account,
        in: money_in, out: money_out, proof: v.proof
      });
      toast('Transaksi tersimpan');
      cashView();
    }
  });
}

/** Daftar kategori: tambah baru, atau nonaktifkan / aktifkan. Tidak ada hapus, supaya riwayat tetap utuh. */
function kasCategoryManager() {
  openCustom({
    title: 'Kelola kategori',
    readOnly: true,
    html: '<div id="kasCatBox"></div>',
    onOpen: function (body) {
      const draw = function () {
        const cats = KasState.data.categories;
        $('kasCatBox').innerHTML =
          '<div class="table-scroll"><table class="data"><thead><tr><th>Kategori</th><th>Status</th><th></th></tr></thead><tbody>' +
          cats.map(function (c) {
            return '<tr><td>' + esc(c.name) + '</td><td>' + (c.active ? 'Aktif' : '<span class="muted">Nonaktif</span>') + '</td>' +
              '<td><button class="btn small" type="button" data-act="toggle" data-id="' + esc(c.id) + '" data-on="' + (c.active ? '0' : '1') + '">' +
              (c.active ? 'Nonaktifkan' : 'Aktifkan') + '</button></td></tr>';
          }).join('') + '</tbody></table></div>' +
          '<div class="row-actions" style="margin-top:12px"><input type="text" id="kasNewCat" placeholder="Nama kategori baru" style="flex:1">' +
          '<button class="btn primary" type="button" data-act="addcat">+ Tambah</button></div>' +
          '<p class="small muted" style="margin-top:8px">Kategori yang dinonaktifkan tidak bisa dipilih untuk transaksi baru, tapi riwayat lama tetap tampil.</p>';
      };
      draw();
      body.onclick = async function (ev) {
        const el = ev.target.closest('[data-act]');
        if (!el) return;
        try {
          if (el.dataset.act === 'toggle') {
            await api('apiSaveKasCategory', App.token, { id: el.dataset.id, active: el.dataset.on === '1' });
          } else if (el.dataset.act === 'addcat') {
            await api('apiSaveKasCategory', App.token, { name: $('kasNewCat').value });
          } else return;
          KasState.data = await api('apiGetCashbook', App.token, { month: KasState.month });
          draw();
        } catch (err) {
          toast(err.message, 'error');
        }
      };
    }
  });
}
</script>
