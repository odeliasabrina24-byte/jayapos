# Membuat aplikasi Android JayaPrint (file APK) setiap kali kode di android/ berubah,
# lalu menaruhnya di halaman Releases supaya bisa diunduh langsung dari HP:
#   https://github.com/odeliasabrina24-byte/jayapos/releases/latest/download/JayaPrint.apk
# Kunci tanda tangan ada di android/app/jayaprint.jks — jangan dihapus, supaya update
# bisa dipasang di atas versi lama.
name: Buat aplikasi JayaPrint
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/jayaprint.yml']
  workflow_dispatch:
concurrency: jayaprint
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - id: sdk
        uses: android-actions/setup-android@v3
      - id: gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Buat APK
        id: apk
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Siapkan file
        id: file
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          case "$APK" in *unsigned*) echo "APK belum ditandatangani"; exit 1;; esac
          cp "$APK" JayaPrint.apk
          VER=$(grep -o "appVersionName = '[^']*'" android/app/build.gradle | grep -o "'.*'" | tr -d "'")
          echo "VER=$VER" >> "$GITHUB_ENV"
      - name: Taruh di Releases
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="jayaprint-v$VER"
          NOTES="Aplikasi printer struk JayaPrint versi $VER. Buka di HP/tablet, unduh JayaPrint.apk, lalu pasang."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" JayaPrint.apk --clobber
          else
            gh release create "$TAG" JayaPrint.apk --title "JayaPrint $VER" --notes "$NOTES" --latest
          fi
      - name: Simpan catatan build (branch ci-logs)
        if: always()
        shell: bash
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs" && cd "$RUNNER_TEMP/logs"
          printf '%s\n' "$STEPS" > steps.json
          cp "$RUNNER_TEMP/build.log" build.log 2>/dev/null || echo "(tidak ada build.log)" > build.log
          git init -q && git checkout -q -b ci-logs
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "build ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
